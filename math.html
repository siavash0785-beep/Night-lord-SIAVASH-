<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نایت لورد سیاوش</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #020303;
            color: white;

            font-family: Arial, sans-serif;

            padding: 25px 15px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        .back {
            display: inline-block;

            margin-bottom: 30px;

            color: #00ff66;
            text-decoration: none;

            font-size: 16px;
        }

        .title {
            color: #00ff66;

            font-size: 30px;

            text-shadow:
                0 0 10px #00ff66,
                0 0 25px #00ff66;

            margin-bottom: 35px;
        }

        .welcome {
            background: #0b0b0b;

            border: 1px solid #00ff66;

            border-radius: 15px;

            padding: 30px;

            box-shadow:
                0 0 20px rgba(0,255,100,0.2),
                0 0 50px rgba(0,255,100,0.08);
        }

        .welcome h2 {
            color: #00ff66;

            font-size: 24px;

            margin-bottom: 20px;
        }

        .welcome p {
            color: #ddd;

            font-size: 17px;

            line-height: 2;
        }

        .lesson {
            margin-top: 25px;

            background: #0b0b0b;

            border: 1px solid #222;

            border-radius: 15px;

            padding: 25px;

            text-align: right;
        }

        .lesson h2 {
            color: #00ff66;
        }

        .lesson p {
            color: #ccc;

            line-height: 2;
        }

        .btn {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 25px;

            background: #00c853;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }

        .btn:hover {
            background: #00ff66;
            color: black;
        }

    </style>

</head>

<body>

    <div class="container">

        <a href="grade9.html" class="back">
            ← برگشت به صفحه 
        </a>

        <h1 class="title">
            🖤 نایت لورد سیاوش
        </h1>

        <div class="welcome">

            <h2>
                خوش آمدی به بهترین سایت نایت لورد سیاوش
            </h2>

            <p>
                این بخش برای آموزش‌های درسی ساخته شده است.
                آموزش‌های جدید در اینجا قرار خواهند گرفت.
            </p>

        </div>

        <div class="lesson">

            <h2>
                📚 آموزش های هکری
            </h2>

            <p>
                وقتی آموزش جدید اضافه شود،
                متن، عکس، فایل و محتوای آموزشی
                در این قسمت نمایش داده خواهد شد.
            </p>

            <a href="#" class="btn">
                شروع آموزش
            </a>

        </div>

    </div>

</body>

</html>
