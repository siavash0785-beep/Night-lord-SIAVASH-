<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Lessons</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #020303;
            color: white;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        .home-container {
            max-width: 700px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
        }

        .grades {
            display: grid;
            gap: 20px;
            margin-top: 35px;
        }

        .grade {
            display: block;
            padding: 25px;
            background: #101010;
            border: 1px solid #00ff66;
            border-radius: 15px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .grade:hover {
            background: #00ff66;
            color: black;
            transform: scale(1.03);
        }

        .grade h2 {
            margin: 0 0 8px;
        }

        .grade p {
            margin: 0;
            color: #aaa;
        }

        .grade:hover p {
            color: black;
        }
    </style>
</head>

<body>

    <div class="home-container">

        <h1>Night lord SIAVASH</h1>

        <p>Select your grade</p>

        <div class="grades">

            <a href="grade9.html" class="grade">
                <h2>Termux Commands</h2>
                <p>Termux Commands Subjects</p>
            </a>

            <a href="grade10.html" class="grade">
                <h2>Direct Hacking Tutorials</h2>
                <p>Direct Hacking Tutorials Subjects</p>
            </a>

            <a href="grade11.html" class="grade">
                <h2>Reporting Tutorials</h2>
                <p>Reporting TutorialsSubjects</p>
            </a>

        </div>

    </div>

</body>
</html>
